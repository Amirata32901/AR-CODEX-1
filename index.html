<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>مرکز دانلود فایل‌ها</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#0b1020,#151d35 55%,#101827);color:#f8fafc;display:flex;justify-content:center;align-items:center;padding:28px}
    .wrap{width:min(760px,100%)}
    header{text-align:center;margin-bottom:28px}
    .badge{display:inline-block;padding:7px 13px;border:1px solid #34445f;border-radius:30px;color:#a5b4fc;font-size:12px;margin-bottom:14px}
    h1{font-size:clamp(27px,5vw,40px);margin:0 0 10px}
    .sub{color:#aab6ca;line-height:1.9;margin:0}
    .panel{background:rgba(20,29,49,.88);border:1px solid #2c3b56;border-radius:22px;padding:22px;box-shadow:0 22px 70px #0005}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    h2{font-size:17px;margin:0}
    #count{font-size:12px;color:#aab6ca}
    #files{display:grid;gap:10px}
    .file{display:flex;align-items:center;gap:13px;padding:14px;background:#111a2d;border:1px solid #293953;border-radius:14px}
    .icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#26365a;color:#c7d2fe;font-size:20px;flex-shrink:0}
    .info{min-width:0;flex:1}
    .name{font-size:14px;overflow-wrap:anywhere;margin-bottom:6px}
    .size{font-size:11px;color:#91a0b8}
    .download{background:#7c83ff;color:white;text-decoration:none;padding:10px 14px;border-radius:10px;font-size:12px;white-space:nowrap;transition:.2s}
    .download:hover{background:#6269e8;transform:translateY(-2px)}
    .state{text-align:center;color:#aab6ca;padding:28px 10px;line-height:2}
    footer{text-align:center;color:#71819b;font-size:11px;margin-top:18px}
    @media(max-width:480px){body{padding:18px}.panel{padding:15px}.file{gap:9px;padding:11px}.download{padding:9px 10px}.icon{width:36px;height:36px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <span class="badge">FILE DOWNLOAD CENTER</span>
      <h1>مرکز دانلود فایل‌ها</h1>
      <p class="sub">فایل موردنظرت رو از فهرست زیر پیدا کن و دریافتش کن.</p>
    </header>
    <section class="panel">
      <div class="top"><h2>فایل‌های قابل دانلود</h2><span id="count">در حال بارگذاری…</span></div>
      <div id="files"><div class="state">در حال دریافت فهرست فایل‌ها…</div></div>
    </section>
    <footer>فهرست فایل‌ها به‌صورت خودکار از مخزن دریافت می‌شود.</footer>
  </main>
  <script>
    const owner = "Amirata32901";
    const repo = "AR-CODEX-1";
    const list = document.getElementById("files");
    const count = document.getElementById("count");
    const formatSize = n => n < 1024 ? n + " بایت" : n < 1048576 ? (n/1024).toFixed(1) + " کیلوبایت" : (n/1048576).toFixed(1) + " مگابایت";
    async function loadFiles(){
      try{
        const response = await fetch("https://api.github.com/repos/" + owner + "/" + repo + "/contents");
        if(!response.ok) throw new Error("GitHub API response");
        const data = await response.json();
        const files = data.filter(item => item.type === "file" && item.name.toLowerCase() !== "index.html");
        count.textContent = files.length + " فایل";
        if(!files.length){
          list.innerHTML = '<div class="state">هنوز فایلی برای دانلود قرار نگرفته است.<br>بعد از اضافه‌کردن فایل‌ها به مخزن، اینجا نمایش داده می‌شوند.</div>';
          return;
        }
        list.innerHTML = files.map(file => `
          <div class="file">
            <div class="icon">↓</div>
            <div class="info"><div class="name">${escapeHTML(file.name)}</div><div class="size">${formatSize(file.size)}</div></div>
            <a class="download" href="${file.download_url}" download>دانلود</a>
          </div>`).join("");
      }catch(error){
        count.textContent = "خطا";
        list.innerHTML = '<div class="state">دریافت فهرست فایل‌ها ممکن نشد.<br>لطفاً چند لحظه دیگر دوباره صفحه را باز کن.</div>';
      }
    }
    function escapeHTML(value){
      return value.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    loadFiles();
  </script>
</body>
</html>
